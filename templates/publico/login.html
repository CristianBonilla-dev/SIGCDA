<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-CDA | Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .logo-box {
            background-color: #e53935;
            border-radius: 20px;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .logo-box i {
            font-size: 40px;
            color: white;
        }
        .titulo {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .subtitulo {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
            border: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .card-title {
            font-size: 24px;
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
        }
        .card-subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 28px;
        }
        .form-label {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }
        .input-group-text {
            background: white;
            border-right: none;
            color: #aaa;
        }
        .form-control {
            border-left: none;
            box-shadow: none !important;
        }
        .form-control:focus {
            border-color: #ced4da;
        }
        .input-group:focus-within {
            outline: 2px solid #e53935;
            border-radius: 8px;
        }
        .input-group {
            border-radius: 8px;
            overflow: hidden;
        }
        .btn-ingresar {
            background-color: #e53935;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-ingresar:hover {
            background-color: #c62828;
            color: white;
        }
        .consulta-link {
            text-align: center;
            margin-top: 20px;
        }
        .consulta-link a {
            color: #e53935;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
        }
        .consulta-link a:hover {
            color: #c62828;
        }
        .alert {
            display: none;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <!-- Logo y título -->
    <div class="logo-box">
        <i class="bi bi-car-front-fill"></i>
    </div>
    <div class="titulo">SIG-CDA</div>
    <div class="subtitulo">Sistema de Gestión de Diagnóstico Automotor</div>

    <!-- Card login -->
    <div class="card">
        <div class="card-title">Iniciar Sesión</div>
        <div class="card-subtitle">Ingrese sus credenciales para acceder</div>

        <div class="alert alert-danger" id="error-msg"></div>

        <div class="mb-3">
            <label class="form-label">Correo Electrónico</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="email" class="form-control" id="correo" placeholder="usuario@sigcda.com">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="contrasena" placeholder="••••••••">
            </div>
        </div>

        <button class="btn-ingresar" onclick="iniciarSesion()">Ingresar al Sistema</button>

        <div class="consulta-link">
            <a href="/consulta">Consultar estado de mi vehículo</a>
        </div>
    </div>

    <script>
        async function iniciarSesion() {
            const correo = document.getElementById('correo').value;
            const contrasena = document.getElementById('contrasena').value;
            const errorMsg = document.getElementById('error-msg');

            errorMsg.style.display = 'none';

            if (!correo || !contrasena) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Por favor ingresa correo y contraseña';
                return;
            }

            try {
                const respuesta = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, contrasena })
                });

                const datos = await respuesta.json();

                if (datos.error) {
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = datos.mensaje;
                    return;
                }

                localStorage.setItem('token', datos.token);
                localStorage.setItem('rol', datos.rol);
                localStorage.setItem('nombre', datos.nombre);

                if (datos.rol === 'admin') {
                    window.location.href = '/admin/dashboard';
                } else if (datos.rol === 'tecnico') {
                    window.location.href = '/tecnico/revisiones';
                }

            } catch (error) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Error de conexión con el servidor';
            }
        }
    </script>
</body>
</html>
