<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-CDA | Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #000000; font-family: 'Segoe UI', sans-serif; }
        .sidebar {
            background-color: #111111;
            min-height: 100vh;
            padding: 20px 0;
            border-right: 1px solid #222;
            position: fixed;
            width: 220px;
        }
        .sidebar a {
            display: block;
            color: #aaa;
            padding: 12px 24px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .sidebar a:hover, .sidebar a.active {
            color: white;
            background-color: #1a1a1a;
            border-left: 3px solid #e53935;
        }
        .sidebar a i { margin-right: 10px; }
        .main-content { margin-left: 220px; padding: 30px; }
        .page-title { color: white; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .page-subtitle { color: #888; font-size: 14px; margin-bottom: 28px; }
        .card {
            background-color: #111111;
            border: 1px solid #222;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        .card-header {
            background-color: #1a1a1a;
            border-bottom: 1px solid #222;
            border-radius: 12px 12px 0 0 !important;
            padding: 16px 20px;
            color: white;
            font-weight: 600;
        }
        .card-body { padding: 24px; }
        .form-label { color: #ccc; font-size: 13px; font-weight: 600; }
        .form-control, .form-select {
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #1a1a1a;
            border-color: #e53935;
            color: white;
            box-shadow: none;
        }
        .form-control::placeholder { color: #555; }
        .form-select option { background-color: #1a1a1a; }
        .btn-registrar {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-registrar:hover { background-color: #c62828; color: white; }
        .alert { display: none; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div style="padding: 16px 24px; margin-bottom: 12px;">
            <span style="color: #e53935; font-weight: 700; font-size: 18px;">🚗 SIG-CDA</span>
        </div>
        <a href="/admin/dashboard"><i class="bi bi-grid"></i> Dashboard</a>
        <a href="/admin/usuarios" class="active"><i class="bi bi-people"></i> Usuarios</a>
        <a href="/admin/vehiculos"><i class="bi bi-car-front"></i> Vehículos</a>
        <a href="/admin/revisiones"><i class="bi bi-clipboard-check"></i> Revisiones</a>
        <div style="position: absolute; bottom: 20px; width: 100%;">
            <a href="#" onclick="cerrarSesion()"><i class="bi bi-box-arrow-left"></i> Cerrar sesión</a>
        </div>
    </div>

    <!-- Contenido -->
    <div class="main-content">
        <div class="page-title">Gestión de Usuarios</div>
        <div class="page-subtitle">Registra administradores y técnicos del sistema</div>

        <div class="card">
            <div class="card-header">Registrar nuevo usuario</div>
            <div class="card-body">
                <div class="alert alert-danger" id="error-msg"></div>
                <div class="alert alert-success" id="success-msg"></div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre *</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Nombre">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Apellido *</label>
                        <input type="text" class="form-control" id="apellido" placeholder="Apellido">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" id="telefono" placeholder="Ej: 3001234567">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Correo electrónico *</label>
                        <input type="email" class="form-control" id="correo" placeholder="correo@ejemplo.com">
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Contraseña *</label>
                        <input type="password" class="form-control" id="contrasena" placeholder="••••••••">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Rol *</label>
                        <select class="form-select" id="rol">
                            <option value="">Selecciona un rol</option>
                            <option value="admin">Administrador</option>
                            <option value="tecnico">Técnico</option>
                        </select>
                    </div>
                </div>

                <button class="btn-registrar" onclick="registrarUsuario()">
                    <i class="bi bi-person-plus me-2"></i>Registrar Usuario
                </button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const nombre = localStorage.getItem('nombre');
        if (!token) window.location.href = '/';

        async function registrarUsuario() {
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const datos = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                telefono: document.getElementById('telefono').value,
                correo: document.getElementById('correo').value,
                contrasena: document.getElementById('contrasena').value,
                rol: document.getElementById('rol').value
            };

            if (!datos.nombre || !datos.apellido || !datos.correo || !datos.contrasena || !datos.rol) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Por favor completa todos los campos obligatorios';
                return;
            }

            try {
                const res = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(datos)
                });

                const resultado = await res.json();

                if (resultado.error) {
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = resultado.mensaje;
                    return;
                }

                successMsg.style.display = 'block';
                successMsg.textContent = 'Usuario registrado correctamente';
                document.querySelectorAll('.form-control, .form-select').forEach(el => el.value = '');

            } catch (error) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Error de conexión con el servidor';
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = '/';
        }
    </script>
</body>
</html>
