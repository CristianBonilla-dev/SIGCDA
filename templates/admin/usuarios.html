<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-CDA | Registrar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; }
        .navbar { background-color: #1F5C99; }
        .card {
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            margin: 40px auto;
            max-width: 560px;
        }
        .card-header {
            background-color: #1F5C99;
            color: white;
            border-radius: 16px 16px 0 0 !important;
            padding: 20px;
        }
        .btn-primary {
            background-color: #1F5C99;
            border: none;
            width: 100%;
            padding: 12px;
        }
        .btn-primary:hover { background-color: #174d82; }
        .alert { display: none; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark px-4 py-3">
        <span class="navbar-brand">🚗 SIG-CDA</span>
        <div>
            <span class="text-white me-3" id="nombre-usuario"></span>
            <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Registrar nuevo usuario</h5>
            </div>
            <div class="card-body p-4">
                <div class="alert alert-danger" id="error-msg"></div>
                <div class="alert alert-success" id="success-msg"></div>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Nombre">
                    </div>
                    <div class="col">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="apellido" placeholder="Apellido">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="text" class="form-control" id="telefono" placeholder="Ej: 3001234567">
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" placeholder="correo@ejemplo.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" placeholder="••••••••">
                </div>
                <div class="mb-4">
                    <label class="form-label">Rol</label>
                    <select class="form-select" id="rol">
                        <option value="">Selecciona un rol</option>
                        <option value="admin">Administrador</option>
                        <option value="tecnico">Técnico</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="registrarUsuario()">Registrar Usuario</button>
                <div class="text-center mt-3">
                    <a href="/admin/dashboard">← Volver al dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Verificar sesión
        const token = localStorage.getItem('token');
        const nombre = localStorage.getItem('nombre');
        if (!token) window.location.href = '/';
        document.getElementById('nombre-usuario').textContent = nombre;

        async function registrarUsuario() {
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const datos = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                telefono: document.getElementById('telefono').value,
                correo: document.getElementById('correo').value,
                contrasena: document.getElementById('contrasena').value,
                rol: document.getElementById('rol').value
            };

            if (!datos.nombre || !datos.apellido || !datos.correo || !datos.contrasena || !datos.rol) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Por favor completa todos los campos obligatorios';
                return;
            }

            try {
                const respuesta = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                if (resultado.error) {
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = resultado.mensaje;
                    return;
                }

                successMsg.style.display = 'block';
                successMsg.textContent = 'Usuario registrado correctamente';

                // Limpiar formulario
                document.getElementById('nombre').value = '';
                document.getElementById('apellido').value = '';
                document.getElementById('telefono').value = '';
                document.getElementById('correo').value = '';
                document.getElementById('contrasena').value = '';
                document.getElementById('rol').value = '';

            } catch (error) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Error de conexión con el servidor';
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('token');
            localStorage.removeItem('rol');
            localStorage.removeItem('nombre');
            window.location.href = '/';
        }
    </script>
</body>
</html>
