<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-CDA | Técnico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #f5f5f5; font-family: 'Segoe UI', sans-serif; display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 260px; min-height: 100vh;
            background-color: #111111;
            display: flex; flex-direction: column;
            padding: 20px 16px;
            position: fixed; top: 0; left: 0; bottom: 0;
        }
        .sidebar-brand {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 32px; padding: 4px 8px;
        }
        .brand-icon {
            background-color: #e53935; border-radius: 10px;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
        }
        .brand-icon i { color: white; font-size: 22px; }
        .brand-text { color: white; font-weight: 700; font-size: 16px; line-height: 1.2; }
        .brand-role { color: #888; font-size: 12px; font-weight: 400; }
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; border-radius: 10px;
            color: #888; text-decoration: none; font-size: 14px;
            font-weight: 500; transition: all 0.2s; margin-bottom: 4px;
        }
        .nav-item.active { background-color: #e53935; color: white; }
        .nav-item:hover:not(.active) { background-color: #1a1a1a; color: white; }
        .sidebar-bottom { margin-top: auto; }
        .btn-logout {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; border-radius: 10px;
            color: #888; text-decoration: none; font-size: 14px;
            font-weight: 500; transition: all 0.2s; width: 100%;
            background: none; border: none; cursor: pointer;
        }
        .btn-logout:hover { background-color: #1a1a1a; color: white; }

        /* Main */
        .main-content { margin-left: 260px; padding: 40px; flex: 1; }
        .page-title { font-size: 28px; font-weight: 700; color: #111; margin-bottom: 4px; }
        .page-subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }

        /* Metric cards */
        .metric-card {
            background: white; border-radius: 16px;
            padding: 24px; display: flex;
            justify-content: space-between; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .metric-label { font-size: 13px; color: #888; margin-bottom: 8px; }
        .metric-value { font-size: 32px; font-weight: 700; color: #111; }
        .metric-icon {
            width: 56px; height: 56px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
        }
        .icon-red { background-color: #e53935; color: white; }
        .icon-dark { background-color: #111111; color: white; }
        .icon-red-outline { background-color: #e53935; color: white; }

        /* Sección */
        .section-card {
            background: white; border-radius: 16px;
            padding: 24px; margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .section-title {
            font-size: 16px; font-weight: 600; color: #111;
            margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
        }
        .section-title i.text-danger { color: #e53935 !important; }
        .section-title i.text-success { color: #28a745 !important; }

        /* Revision card pendiente */
        .rev-card {
            border: 1px solid #eee; border-radius: 12px;
            padding: 20px 24px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            background: white;
        }
        .rev-placa { font-size: 18px; font-weight: 700; color: #111; margin-right: 8px; }
        .rev-id { background: #f0f0f0; color: #555; padding: 2px 10px; border-radius: 20px; font-size: 12px; }
        .rev-vehiculo { font-size: 15px; font-weight: 600; color: #333; margin: 6px 0 4px; }
        .rev-propietario { font-size: 13px; color: #888; margin-bottom: 6px; }
        .rev-meta { font-size: 13px; color: #888; display: flex; align-items: center; gap: 16px; }
        .rev-meta i { margin-right: 4px; }
        .rev-tipo { font-size: 13px; color: #888; margin-top: 4px; }
        .btn-inspeccion {
            background-color: #e53935; color: white;
            border: none; padding: 12px 20px; border-radius: 10px;
            font-size: 14px; font-weight: 600; white-space: nowrap;
            cursor: pointer; transition: background 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-inspeccion:hover { background-color: #c62828; }

        /* Tabla completadas */
        .table { color: #333; }
        .table thead th {
            color: #888; font-size: 12px; text-transform: uppercase;
            border-bottom: 1px solid #eee; font-weight: 600; padding: 12px 16px;
        }
        .table td { padding: 14px 16px; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
        .badge-completada {
            background-color: #e8f5e9; color: #28a745;
            border: 1px solid #c8e6c9; padding: 4px 12px;
            border-radius: 20px; font-size: 12px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .badge-aprobado {
            background-color: #e8f5e9; color: #28a745;
            border: 1px solid #c8e6c9; padding: 4px 12px;
            border-radius: 20px; font-size: 12px; font-weight: 600;
        }
        .badge-rechazado {
            background-color: #ffebee; color: #e53935;
            border: 1px solid #ffcdd2; padding: 4px 12px;
            border-radius: 20px; font-size: 12px; font-weight: 600;
        }
        .empty-state { text-align: center; color: #bbb; padding: 32px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="bi bi-car-front-fill"></i></div>
            <div>
                <div class="brand-text">SIG-CDA</div>
                <div class="brand-role">Técnico</div>
            </div>
        </div>
        <a href="/tecnico/revisiones" class="nav-item active">
            <i class="bi bi-clipboard-check"></i> Revisiones Asignadas
        </a>
        <div class="sidebar-bottom">
            <button class="btn-logout" onclick="cerrarSesion()">
                <i class="bi bi-box-arrow-left"></i> Cerrar Sesión
            </button>
        </div>
    </div>

    <!-- Main -->
    <div class="main-content">
        <div class="page-title">Revisiones Asignadas</div>
        <div class="page-subtitle">Gestiona tus inspecciones programadas</div>

        <!-- Métricas -->
        <div class="row mb-4">
            <div class="col-md-4 mb-3">
                <div class="metric-card">
                    <div>
                        <div class="metric-label">Revisiones Asignadas</div>
                        <div class="metric-value" id="total-asignadas">0</div>
                    </div>
                    <div class="metric-icon icon-red"><i class="bi bi-clipboard-list"></i></div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="metric-card">
                    <div>
                        <div class="metric-label">Completadas</div>
                        <div class="metric-value" id="total-completadas">0</div>
                    </div>
                    <div class="metric-icon icon-dark"><i class="bi bi-check-circle"></i></div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="metric-card">
                    <div>
                        <div class="metric-label">Pendientes</div>
                        <div class="metric-value" id="total-pendientes">0</div>
                    </div>
                    <div class="metric-icon icon-red-outline"><i class="bi bi-clock"></i></div>
                </div>
            </div>
        </div>

        <!-- Pendientes -->
        <div class="section-card">
            <div class="section-title">
                <i class="bi bi-clock-fill text-danger"></i> Revisiones Pendientes
            </div>
            <div id="lista-pendientes">
                <div class="empty-state">Cargando...</div>
            </div>
        </div>

        <!-- Completadas -->
        <div class="section-card">
            <div class="section-title">
                <i class="bi bi-check-circle-fill text-success"></i> Revisiones Completadas
            </div>
            <table class="table mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Placa</th>
                        <th>Vehículo</th>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="lista-completadas">
                    <tr><td colspan="6" class="empty-state">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const nombre = localStorage.getItem('nombre');
        if (!token) window.location.href = '/';

        async function cargarRevisiones() {
            try {
                const res = await fetch('/api/revisiones', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const datos = await res.json();
                const revisiones = datos.revisiones || [];

                const pendientes  = revisiones.filter(r => r.estado === 'pendiente');
                const completadas = revisiones.filter(r => r.estado !== 'pendiente');

                document.getElementById('total-asignadas').textContent  = revisiones.length;
                document.getElementById('total-completadas').textContent = completadas.length;
                document.getElementById('total-pendientes').textContent  = pendientes.length;

                // Pendientes
                const listaPend = document.getElementById('lista-pendientes');
                if (!pendientes.length) {
                    listaPend.innerHTML = '<div class="empty-state">No tienes revisiones pendientes</div>';
                } else {
                    listaPend.innerHTML = pendientes.map(r => {
                        const fecha = new Date(r.fecha_revision).toLocaleDateString('es-CO');
                        return `
                        <div class="rev-card">
                            <div>
                                <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                                    <span class="rev-placa">${r.placa}</span>
                                    <span class="rev-id">REV-00${r.id_revision}</span>
                                </div>
                                <div class="rev-vehiculo">${r.marca || ''} ${r.modelo || ''}</div>
                                <div class="rev-propietario">Propietario: ${r.nombre_propietario}</div>
                                <div class="rev-meta">
                                    <span><i class="bi bi-calendar3"></i>${fecha}</span>
                                    <span><i class="bi bi-clock"></i>${r.hora_revision || '--:--'}</span>
                                </div>
                                <div class="rev-tipo">${r.tipo_revision}</div>
                            </div>
                            <button class="btn-inspeccion" onclick="realizarInspeccion(${r.id_revision})">
                                Realizar Inspección <i class="bi bi-arrow-right"></i>
                            </button>
                        </div>`;
                    }).join('');
                }

                // Completadas
                const tbody = document.getElementById('lista-completadas');
                if (!completadas.length) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No hay revisiones completadas</td></tr>';
                } else {
                    tbody.innerHTML = completadas.map(r => {
                        const fecha = new Date(r.fecha_revision).toLocaleDateString('es-CO');
                        const badge = r.resultado === 'aprobado'
                            ? `<span class="badge-aprobado">✓ Aprobado</span>`
                            : `<span class="badge-rechazado">✗ Rechazado</span>`;
                        return `
                        <tr>
                            <td><strong>REV-00${r.id_revision}</strong></td>
                            <td><strong>${r.placa}</strong></td>
                            <td>${r.marca || ''} ${r.modelo || ''}</td>
                            <td>${fecha}</td>
                            <td style="color:#888">${r.tipo_revision}</td>
                            <td>${badge}</td>
                        </tr>`;
                    }).join('');
                }
            } catch(e) {
                console.error(e);
            }
        }

        function realizarInspeccion(id_revision) {
            localStorage.setItem('id_revision_activa', id_revision);
            window.location.href = '/tecnico/inspeccion';
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = '/';
        }

        cargarRevisiones();
    </script>
</body>
</html>
